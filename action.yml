name: 'zn-gate AI Agent Security Linter'
description: 'Prompt-injection and secret linter for AI agent prompts and tools, and an auditor for agent configs and plugins: .claude/, .mcp.json, .codex/, .cursor/, hooks, AGENTS.md, CLAUDE.md, skills.'
author: 'zn <admin@usezn.com>'
branding:
  icon: 'shield'
  color: 'green'

# The action installs the published zn-gate packages at the exact version given
# in `version` (the Python package from PyPI for `scan`, the npm package for
# `audit`); it does not run code from this repository. `version` defaults to
# the current stable release and is bumped when a new release is cut.

inputs:
  version:
    description: 'zn-gate version to install, as an exact version number (for example 1.6.0). Ranges and "latest" are not accepted. `audit` needs 1.6.0 or later.'
    required: false
    default: '1.4.1'
  mode:
    description: 'scan (prompt-injection and secret scan of files, the behaviour of earlier releases), audit (audit of agent configs, hooks, MCP servers, plugins and skills), or both'
    required: false
    default: 'both'
  package-sha256:
    description: 'Optional SHA-256 of the zn-gate wheel on PyPI for `version`. When set, pip refuses a file with a different hash.'
    required: false
    default: ''
  npm-integrity:
    description: 'Optional integrity string (sha512-...) of the zn-gate npm tarball for `version`. When set, the audit refuses a tarball with a different hash.'
    required: false
    default: ''
  path:
    description: 'Path or directory to scan and audit'
    required: false
    default: '.'
  fail-on-threat:
    description: 'Whether to fail the CI step if any threat is detected (true/false). For audit, true fails on high and critical findings unless `fail-on` is set.'
    required: false
    default: 'true'
  fail-on:
    description: 'Audit only: lowest severity that fails the step (low, medium, high, critical, none). Empty means high when fail-on-threat is true and none when it is false.'
    required: false
    default: ''
  agents:
    description: 'Audit only: comma-separated agents to audit (passed to zn audit --agents). Empty audits every agent zn audit supports.'
    required: false
    default: ''
  format:
    description: 'Output format: github (default, with inline annotations), text, json, or sarif (writes a SARIF file, see the sarif-file output)'
    required: false
    default: 'github'
  sarif-file:
    description: 'With format sarif: where to write the SARIF file. Empty writes zn-gate.sarif in the runner temp directory.'
    required: false
    default: ''

outputs:
  sarif-file:
    description: 'Path of the SARIF file (format sarif only)'
    value: ${{ steps.run.outputs.sarif-file }}
  scan-exit-code:
    description: 'Exit code of zn-gate scan (0 clean, 1 findings, 2 error); empty if it did not run'
    value: ${{ steps.run.outputs.scan-exit-code }}
  audit-exit-code:
    description: 'Exit code of zn audit (0 clean, 1 findings at or above fail-on, 2 error); empty if it did not run'
    value: ${{ steps.run.outputs.audit-exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Check inputs
      id: plan
      shell: bash
      env:
        ZN_VERSION: ${{ inputs.version }}
        ZN_MODE: ${{ inputs.mode }}
        ZN_FORMAT: ${{ inputs.format }}
        ZN_FAIL_ON: ${{ inputs.fail-on }}
        ZN_AGENTS: ${{ inputs.agents }}
        ZN_SHA256: ${{ inputs.package-sha256 }}
        ZN_NPM_INTEGRITY: ${{ inputs.npm-integrity }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=zn-gate::$1"; exit 2; }
        # Exact release versions only (1.6.0, 1.6.0b1, 1.6.0rc1, 1.6.0.post1).
        [[ "$ZN_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)((a|b|rc)([0-9]+))?(\.post[0-9]+)?$ ]] \
          || fail "'version' must be an exact zn-gate version such as 1.6.0"
        major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
        pre=${BASH_REMATCH[5]}; pren=${BASH_REMATCH[6]}
        [[ "$ZN_VERSION" =~ \.post ]] && [ "$ZN_MODE" != scan ] \
          && fail "'version' with .post is a PyPI-only version; use it with mode: scan"
        case "$ZN_MODE" in scan|audit|both) ;; *) fail "'mode' must be scan, audit or both" ;; esac
        case "$ZN_FORMAT" in github|text|json|sarif) ;; *) fail "'format' must be github, text, json or sarif" ;; esac
        case "$ZN_FAIL_ON" in ''|low|medium|high|critical|none) ;; *) fail "'fail-on' must be low, medium, high, critical or none" ;; esac
        [[ "$ZN_AGENTS" =~ ^[a-z0-9,-]*$ ]] || fail "'agents' must be a comma-separated list of agent names"
        [ -z "$ZN_SHA256" ] || [[ "$ZN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || fail "'package-sha256' must be a 64-character hex SHA-256"
        [ -z "$ZN_NPM_INTEGRITY" ] || [[ "$ZN_NPM_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]] || fail "'npm-integrity' must be a sha512-... integrity string"

        run_scan=false; run_audit=false
        [ "$ZN_MODE" = audit ] || run_scan=true
        if [ "$ZN_MODE" != scan ]; then
          if [ "$major" -gt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -ge 6 ]; }; then
            run_audit=true
          elif [ "$ZN_MODE" = audit ]; then
            fail "mode: audit needs zn-gate 1.6.0 or later (version is $ZN_VERSION)"
          else
            echo "::warning title=zn-gate::zn-gate $ZN_VERSION has no audit; running the scan only. Set version to 1.6.0 or later to audit agent configs, or mode: scan to silence this warning."
          fi
        fi
        # npm spells pre-releases 1.6.0-beta.1 where PyPI has 1.6.0b1.
        npm_version="$major.$minor.$patch"
        case "$pre" in
          a) npm_version+="-alpha.$pren" ;;
          b) npm_version+="-beta.$pren" ;;
          rc) npm_version+="-rc.$pren" ;;
        esac
        {
          echo "run-scan=$run_scan"
          echo "run-audit=$run_audit"
          echo "npm-version=$npm_version"
        } >> "$GITHUB_OUTPUT"

    # Python runs the scan and the SARIF helper in every mode.
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install zn-gate (PyPI)
      id: install-py
      if: steps.plan.outputs.run-scan == 'true'
      shell: bash
      env:
        ZN_VERSION: ${{ inputs.version }}
        ZN_SHA256: ${{ inputs.package-sha256 }}
        ZN_VENV: ${{ runner.temp }}/zn-gate-venv
      run: |
        set -euo pipefail
        # A fresh virtualenv on every run, so the version and hash are always checked.
        python -m venv --clear "$ZN_VENV"
        if [ -x "$ZN_VENV/bin/python" ]; then
          py="$ZN_VENV/bin/python"
        else
          py="$ZN_VENV/Scripts/python.exe"
        fi
        req="$ZN_VENV/zn-gate-requirements.txt"
        if [ -n "$ZN_SHA256" ]; then
          printf 'zn-gate==%s --hash=sha256:%s\n' "$ZN_VERSION" "$ZN_SHA256" > "$req"
        else
          printf 'zn-gate==%s\n' "$ZN_VERSION" > "$req"
        fi
        # Wheel only (no build step runs), no dependencies (zn-gate has none),
        # into a private virtualenv so the workflow's own packages are untouched.
        "$py" -I -m pip install --disable-pip-version-check --no-input --no-cache-dir \
          --only-binary=:all: --no-deps -r "$req"
        installed="$("$py" -I -c 'import zn_gate; print(zn_gate.__version__)')"
        echo "Installed zn-gate $installed (PyPI)"
        echo "python=$py" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.plan.outputs.run-audit == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Install zn-gate (npm)
      id: install-npm
      if: steps.plan.outputs.run-audit == 'true'
      shell: bash
      env:
        ZN_NPM_VERSION: ${{ steps.plan.outputs.npm-version }}
        ZN_NPM_INTEGRITY: ${{ inputs.npm-integrity }}
        ZN_NPM_DIR: ${{ runner.temp }}/zn-gate-npm
      run: |
        set -euo pipefail
        rm -rf "$ZN_NPM_DIR"
        mkdir -p "$ZN_NPM_DIR/pkg" "$ZN_NPM_DIR/install"
        cd "$ZN_NPM_DIR/pkg"
        # npm checks the tarball against the registry's integrity hash.
        npm pack "zn-gate@$ZN_NPM_VERSION" --silent --ignore-scripts > packed.txt
        tgz="$ZN_NPM_DIR/pkg/$(tail -n 1 packed.txt)"
        if [ -n "$ZN_NPM_INTEGRITY" ]; then
          actual="$(node -e 'const c=require("crypto"),f=require("fs");process.stdout.write("sha512-"+c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "$tgz")"
          if [ "$actual" != "$ZN_NPM_INTEGRITY" ]; then
            echo "::error title=zn-gate::npm tarball integrity mismatch: expected $ZN_NPM_INTEGRITY, got $actual"
            exit 2
          fi
        fi
        # Install scripts never run; dependencies are bundled in the tarball.
        cd "$ZN_NPM_DIR/install"
        npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --silent "$tgz"
        cli="$ZN_NPM_DIR/install/node_modules/zn-gate/bin/cli.js"
        installed="$(node -p 'require(process.argv[1]).version' "$ZN_NPM_DIR/install/node_modules/zn-gate/package.json")"
        if [ "$installed" != "$ZN_NPM_VERSION" ]; then
          echo "::error title=zn-gate::installed zn-gate $installed, expected $ZN_NPM_VERSION"
          exit 2
        fi
        echo "Installed zn-gate $installed (npm)"
        echo "cli=$cli" >> "$GITHUB_OUTPUT"

    - name: Run zn-gate
      id: run
      shell: bash
      env:
        ZN_RUN_SCAN: ${{ steps.plan.outputs.run-scan }}
        ZN_RUN_AUDIT: ${{ steps.plan.outputs.run-audit }}
        ZN_PYTHON: ${{ steps.install-py.outputs.python }}
        ZN_CLI: ${{ steps.install-npm.outputs.cli }}
        ZN_VERSION: ${{ inputs.version }}
        ZN_PATH: ${{ inputs.path }}
        ZN_FORMAT: ${{ inputs.format }}
        ZN_FAIL_ON_THREAT: ${{ inputs.fail-on-threat }}
        ZN_FAIL_ON: ${{ inputs.fail-on }}
        ZN_AGENTS: ${{ inputs.agents }}
        ZN_SARIF_FILE: ${{ inputs.sarif-file }}
        ZN_WORK: ${{ runner.temp }}/zn-gate-run
      run: |
        set -uo pipefail
        rm -rf "$ZN_WORK"
        mkdir -p "$ZN_WORK"
        # Helper for SARIF: convert scan JSON, merge runs, print annotations.
        cat > "$ZN_WORK/sarif.py" <<'PY'
        import json, os, sys

        SCHEMA = "https://json.schemastore.org/sarif-2.1.0.json"

        def load(p):
            with open(p, encoding="utf-8") as f:
                return json.load(f)

        def scan_run(src, version):
            data = load(src)
            root = os.getcwd()
            rules, results = {}, []
            for t in data.get("threats", []):
                rid = str(t.get("rule") or "zn-gate")
                rules.setdefault(rid, {"id": rid, "shortDescription": {"text": rid},
                                       "properties": {"tags": ["security", t.get("type", "injection")]}})
                uri = os.path.relpath(os.path.abspath(t["file"]), root).replace(os.sep, "/")
                results.append({
                    "ruleId": rid,
                    "level": "error",
                    "message": {"text": f"{t.get('reason') or rid}: {t.get('content', '')}"},
                    "locations": [{"physicalLocation": {
                        "artifactLocation": {"uri": uri},
                        "region": {"startLine": int(t.get("line") or 1)}}}],
                })
            return {"tool": {"driver": {"name": "zn-gate scan", "version": version,
                                        "informationUri": "https://github.com/usezn/zn",
                                        "rules": list(rules.values())}},
                    "automationDetails": {"id": "zn-gate/scan/"},
                    "results": results}

        def merge(out, version, scan_json, audit_sarif):
            runs = []
            if scan_json:
                runs.append(scan_run(scan_json, version))
            if audit_sarif:
                for i, run in enumerate(load(audit_sarif).get("runs", [])):
                    run.setdefault("automationDetails", {"id": f"zn-gate/audit/{i or ''}"})
                    runs.append(run)
            with open(out, "w", encoding="utf-8") as f:
                json.dump({"$schema": SCHEMA, "version": "2.1.0", "runs": runs}, f, indent=2)
            print(f"[zn-gate] SARIF: {sum(len(r.get('results', [])) for r in runs)} results in {len(runs)} run(s) -> {out}")

        def esc(s, prop=False):
            s = str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            return s.replace(":", "%3A").replace(",", "%2C") if prop else s

        def annotate(src):
            cmd = {"error": "error", "warning": "warning", "note": "notice", "none": "notice"}
            n = 0
            for run in load(src).get("runs", []):
                for r in run.get("results", []):
                    loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                    props = []
                    if loc.get("artifactLocation", {}).get("uri"):
                        props.append("file=" + esc(loc["artifactLocation"]["uri"], True))
                        if loc.get("region", {}).get("startLine"):
                            props.append(f"line={int(loc['region']['startLine'])}")
                    props.append("title=" + esc(f"Agent config audit ({r.get('ruleId', 'zn-gate')})", True))
                    level = cmd.get(r.get("level", "warning"), "warning")
                    print(f"::{level} {','.join(props)}::{esc(r.get('message', {}).get('text', ''))}")
                    n += 1
            print(f"\n[zn-gate] Audit found {n} findings.")

        if __name__ == "__main__":
            op = sys.argv[1]
            if op == "merge":
                merge(sys.argv[2], sys.argv[3], sys.argv[4] or None, sys.argv[5] or None)
            elif op == "annotate":
                annotate(sys.argv[2])
        PY
        helper() { python -I -X utf8 "$ZN_WORK/sarif.py" "$@"; }

        scan_rc=""; audit_rc=""; scan_json=""; audit_sarif=""
        if [ "$ZN_RUN_SCAN" = true ]; then
          echo "::group::zn-gate scan"
          scan_args=(scan)
          if [ "$ZN_FAIL_ON_THREAT" = "false" ]; then scan_args+=(--no-fail); fi
          # -I keeps files in the scanned workspace off the import path; -X utf8
          # lets the text report print on runners whose console code page is not
          # UTF-8 (Windows).
          if [ "$ZN_FORMAT" = sarif ]; then
            scan_json="$ZN_WORK/scan.json"
            "$ZN_PYTHON" -I -X utf8 -m zn_gate.cli "${scan_args[@]}" --format json -- "$ZN_PATH" > "$scan_json"
            scan_rc=$?
          else
            "$ZN_PYTHON" -I -X utf8 -m zn_gate.cli "${scan_args[@]}" --format "$ZN_FORMAT" -- "$ZN_PATH"
            scan_rc=$?
          fi
          echo "::endgroup::"
          echo "zn-gate scan exit code: $scan_rc"
        fi

        if [ "$ZN_RUN_AUDIT" = true ]; then
          echo "::group::zn-gate audit"
          fail_on="$ZN_FAIL_ON"
          if [ -z "$fail_on" ]; then
            if [ "$ZN_FAIL_ON_THREAT" = "false" ]; then fail_on=none; else fail_on=high; fi
          fi
          # zn audit takes the path first; keep a path that starts with "-" from
          # being read as an option.
          audit_path="$ZN_PATH"
          case "$audit_path" in -*) audit_path="./$audit_path" ;; esac
          audit_args=(audit "$audit_path" --fail-on "$fail_on")
          if [ -n "$ZN_AGENTS" ]; then audit_args+=(--agents "$ZN_AGENTS"); fi
          # The audit report quotes repository content: keep it from being read
          # as workflow commands.
          stop_token="zn-$RANDOM$RANDOM$RANDOM"
          case "$ZN_FORMAT" in
            sarif|github)
              audit_sarif="$ZN_WORK/audit.sarif"
              echo "::stop-commands::$stop_token"
              node "$ZN_CLI" "${audit_args[@]}" --format sarif --output "$audit_sarif"
              audit_rc=$?
              echo "::$stop_token::"
              if [ "$ZN_FORMAT" = github ] && [ -s "$audit_sarif" ]; then helper annotate "$audit_sarif"; fi
              ;;
            *)
              echo "::stop-commands::$stop_token"
              node "$ZN_CLI" "${audit_args[@]}" --format "$ZN_FORMAT"
              audit_rc=$?
              echo "::$stop_token::"
              ;;
          esac
          echo "::endgroup::"
          echo "zn audit exit code: $audit_rc (fail-on: $fail_on)"
        fi

        sarif_out=""; merge_rc=0
        if [ "$ZN_FORMAT" = sarif ]; then
          sarif_out="${ZN_SARIF_FILE:-$ZN_WORK/zn-gate.sarif}"
          [ -s "$audit_sarif" ] || audit_sarif=""
          helper merge "$sarif_out" "$ZN_VERSION" "$scan_json" "$audit_sarif" || merge_rc=2
        fi
        {
          echo "sarif-file=$sarif_out"
          echo "scan-exit-code=$scan_rc"
          echo "audit-exit-code=$audit_rc"
        } >> "$GITHUB_OUTPUT"

        # 2 (error) wins over 1 (findings); any other non-zero code counts as an error.
        final=0
        for rc in $scan_rc $audit_rc $merge_rc; do
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then final=2
          elif [ "$rc" -eq 1 ] && [ "$final" -eq 0 ]; then final=1
          fi
        done
        exit "$final"
