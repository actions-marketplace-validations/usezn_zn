name: Changelog

# Pull requests describe their change in a changelog.d/ fragment instead of editing CHANGELOG.md (see changelog.d/README.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Test the fragment tools
        run: node --test .github/scripts/changelog.test.mjs
      - name: Check this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '0' }}
          CHANGELOG_RELEASE: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'chore/backmerge-') || startsWith(github.head_ref, 'chore/pin-plugin-')) && '1' || '0' }}
        run: node .github/scripts/changelog.mjs check --base "$BASE_SHA"
